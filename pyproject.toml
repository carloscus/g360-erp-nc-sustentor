[project]
name = "g360-erp-nc-sustentor"
version = "1.2.2"
description = "G360 ERP NC Sustentor - Automatización de cuadros de sustento de Notas de Crédito (NC) y análisis CRM."
readme = "README.md"
# 3.12 es el target de despliegue (run.bat/launch.vbs lo instalan) y la
# versión de .python-version. El tope <3.13 NO es cosmético:
#   - `flet build` resuelve el Python a empaquetar desde este specifier, y
#     con ">=3.12" sin tope elegía la más nueva soportada (3.14). Como
#     pandas 2.2.3 no publica wheels cp314, el build lo compilaba desde
#     fuente y su pandas_datetime.pyd reventaba con Access Violation
#     (0xC0000005) al convertir fechas: la app se cerraba al cargar el
#     historial. Ver packaging/build_windows.py y tests/test_entorno_build.py.
#   - sin el tope, uv también puede crear el venv con 3.13/3.14 y los tests
#     dejan de validar lo que se despliega.
requires-python = ">=3.12,<3.13"
dependencies = [
    # flet 1.1+ exige el Flutter SDK 3.47.9; esta máquina tiene 3.44.8 en
    # ~/flutter/3.44.8 y subir flet obligaría a descargar otro SDK completo.
    "flet[desktop]>=1.0.5,<1.1.0",
    "numpy>=2.0",
    "openpyxl==3.1.5",
    "pandas==2.2.3",
    "xlrd==2.0.1",
    "python-docx>=1.2.0",
    "pyyaml>=6.0.3",
    "httpx>=0.27.0",
    "qrcode[pil]>=8.0",
]

[project.optional-dependencies]
dev = ["pytest>=9"]

[tool.ruff]
target-version = "py312"
line-length = 100

[tool.ruff.lint]
select = ["E9", "F"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = [
    "real_db: el test audita la base local real de produccion (no se aisla)",
]

[dependency-groups]
dev = [
    "pytest>=9.1.1",
]

[tool.flet]
org = "pe.cipsa"
product = "G360 NC Sustentor"
company = "CIPSA"
copyright = "© CIPSA"
artifact = "g360-nc-sustentor"

[tool.flet.app]
path = "."
module = "main"
